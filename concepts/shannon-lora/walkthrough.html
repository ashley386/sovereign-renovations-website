<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const EXPORT=false; const P=new URLSearchParams('styled=1');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.9;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#e6e2d9');
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture; scene.environmentIntensity=0.35;
// ---------- seeded random ----------
let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;

// ---------- textures ----------
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; if(repeat) t.repeat.set(...repeat); return t;
}
// marble: one 24x48 tile, veins, thin grout on edges
function marbleTile(g,w,h){
  // 48"x48" wall section, Mayfair Suave Bianco look: soft white, linear soft-gray veils; 12x24 horizontal, 1/3 offset
  g.fillStyle='#f4f3f0'; g.fillRect(0,0,w,h);
  for(let i=0;i<50;i++){const x=rnd()*w,y=rnd()*h,r=60+rnd()*200;
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(205,205,207,0.10)'); gr.addColorStop(1,'rgba(205,205,207,0)');
    g.fillStyle=gr; g.fillRect(0,0,w,h);}
  const path=(x,y,ang,steps,step,wob)=>{const pts=[[x,y]];for(let s=0;s<steps;s++){ang+=(rnd()-0.5)*wob;x+=Math.cos(ang)*step;y+=Math.sin(ang)*step;pts.push([x,y]);}return pts;};
  const stroke=(pts,width,col,blur)=>{g.filter=`blur(${blur}px)`;g.beginPath();g.moveTo(...pts[0]);
    for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;g.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
    g.strokeStyle=col;g.lineWidth=width;g.lineCap='round';g.stroke();g.filter='none';};
  for(let k=0;k<7;k++){
    const pts=path(rnd()*w*1.2-w*0.4,-30,0.75+rnd()*0.25,46,32,0.10);
    stroke(pts,40+rnd()*40,'rgba(150,151,156,0.10)',14);
    stroke(pts,6+rnd()*6,'rgba(140,142,148,0.17)',3);
    stroke(pts,1.0+rnd()*1.2,'rgba(125,127,133,0.30)',0.7);
    for(let b=0;b<2;b++){const p=pts[(rnd()*pts.length)|0];const br=path(p[0],p[1],0.5+rnd()*0.6,8+rnd()*10|0,26,0.15);
      stroke(br,1.5+rnd()*1.5,'rgba(135,137,143,0.20)',1.2); }
  }
  // grout: 12"x24" horizontal tiles, 1/3 running offset
  const tw=w/2, th=h/4; g.fillStyle='#c9c7c2';
  for(let r=0;r<4;r++){ g.fillRect(0,r*th,w,3); const off=(r%3)*tw/3;
    for(let c=-1;c<4;c++){ g.fillRect(c*tw+off,r*th,3,th); } }
}
const marbleTexWall = canvasTex(1024,1024,marbleTile);
function darkPlanks(g,w,h){
  const rows=14; const ph=h/rows;
  for(let r=0;r<rows;r++){ let x=-rnd()*w*0.6;
    while(x<w){ const len=w*(0.45+rnd()*0.4); const v=30+rnd()*12|0;
      g.fillStyle=`rgb(${v},${v+1},${v+3})`; g.fillRect(x,r*ph,len,ph);
      for(let k=0;k<26;k++){ g.strokeStyle=`rgba(${v+20},${v+20},${v+22},${0.10+rnd()*0.12})`; g.lineWidth=0.6+rnd();
        const yy=r*ph+rnd()*ph; g.beginPath(); g.moveTo(x,yy); g.bezierCurveTo(x+len*0.3,yy+(rnd()-0.5)*6,x+len*0.6,yy+(rnd()-0.5)*6,x+len,yy+(rnd()-0.5)*4); g.stroke(); }
      g.fillStyle='rgba(15,15,16,0.9)'; g.fillRect(x,r*ph,1.5,ph); x+=len; }
    g.fillStyle='rgba(15,15,16,0.9)'; g.fillRect(0,r*ph,w,1.5); }
}
function blackTile(g,w,h){
  // Overlook Slate look, 12" x 24" tile, black slate look, low gloss, painted grout bevel; 3 columns, 1/3 offset; canvas = 36" x 72"
  const cw=w/3, th=h/3, pxIn=w/36;
  for(let c=0;c<3;c++){ const off=c*th/3;
    for(let r=-1;r<4;r++){ const y=r*th+off; const v=26+rnd()*10|0;
      g.fillStyle=`rgb(${v},${v},${v+3})`; g.fillRect(c*cw,y,cw,th);
      // slate cleft: soft lighter/darker blotches + fine speckle
      for(let k=0;k<26;k++){ const x=c*cw+rnd()*cw, yy=y+rnd()*th, rr=(8+rnd()*40)*pxIn/3;
        const gr=g.createRadialGradient(x,yy,0,x,yy,rr); const d=rnd()<0.5; gr.addColorStop(0,d?'rgba(10,10,12,0.35)':'rgba(70,70,74,0.25)'); gr.addColorStop(1,'rgba(0,0,0,0)');
        g.fillStyle=gr; g.fillRect(x-rr,yy-rr,rr*2,rr*2); }
      for(let k=0;k<14;k++){ g.strokeStyle=`rgba(80,80,84,${0.06+rnd()*0.08})`; g.lineWidth=0.6+rnd()*1.2; const x0=c*cw+rnd()*cw;
        g.beginPath(); g.moveTo(x0,y); g.bezierCurveTo(x0+(rnd()-0.5)*30,y+th*0.3,x0+(rnd()-0.5)*30,y+th*0.7,x0+(rnd()-0.5)*20,y+th); g.stroke(); }
      for(let k=0;k<500;k++){ const q=rnd()<0.5?20:52; g.fillStyle=`rgba(${q},${q},${q+2},0.35)`; g.fillRect(c*cw+rnd()*cw,y+rnd()*th,1.2,1.2); }
      g.fillStyle='#4a4a4c'; g.fillRect(c*cw,y,cw,2.5); }
    g.fillStyle='#4a4a4c'; g.fillRect(c*cw,0,2.5,h); }
}
const floorTex = canvasTex(1024,2048,blackTile);

// ---------- materials ----------
const M = {
  paint: new THREE.MeshStandardMaterial({color:'#ccc9c0', roughness:0.92}),

  trim: new THREE.MeshStandardMaterial({color:'#f6f5f1', roughness:0.6}),

  metal: new THREE.MeshStandardMaterial({color:'#b9b6b0', metalness:0.9, roughness:0.35}),
  mirror: new THREE.MeshStandardMaterial({color:'#c9d0d3', metalness:1, roughness:0.05}),
  frame: new THREE.MeshStandardMaterial({color:'#a9a59d', metalness:0.85, roughness:0.4}),
  pan: new THREE.MeshStandardMaterial({color:'#f7f7f5', roughness:0.3}),
  glass: new THREE.MeshPhysicalMaterial({color:'#e8f2f2', roughness:0.03, metalness:0, transparent:true, opacity:0.16, side:THREE.DoubleSide}),
  glassEdge: new THREE.MeshStandardMaterial({color:'#bfd6d4', transparent:true, opacity:0.55}),
  door: new THREE.MeshStandardMaterial({color:'#f6f5f1', roughness:0.55}),
  lightTrim: new THREE.MeshStandardMaterial({color:'#ffffff', emissive:'#fff6e6', emissiveIntensity:1.4}),

for(const k in M) M[k].name=k;
function carraraTile(g,w,h){
  g.fillStyle='#e7e6e3'; g.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){const x=rnd()*w,y=rnd()*h,r=60+rnd()*160; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(170,171,176,0.18)'); gr.addColorStop(1,'rgba(170,171,176,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h);}
  const vein=(x,y,ang,steps,width,alpha,blur)=>{ g.filter=`blur(${blur}px)`; g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<steps;s++){ang+=(rnd()-0.5)*0.5; x+=Math.cos(ang)*10; y+=Math.sin(ang)*10; g.lineTo(x,y);} g.strokeStyle=`rgba(105,107,113,${alpha})`; g.lineWidth=width; g.stroke(); g.filter='none'; };
  for(let i=0;i<10;i++){ const x=rnd()*w, y=rnd()*h, a=rnd()*Math.PI; vein(x,y,a,70,7,0.16,4); vein(x,y,a,70,1.4,0.45,0.6); }
  for(let i=0;i<25;i++) vein(rnd()*w,rnd()*h,rnd()*Math.PI,25,0.8,0.32,0.4);
}
const carraraTex = canvasTex(1024,512,carraraTile);
function marbleMat(uw,uh){ // uw/uh: surface size in inches -> repeat over 24x48 tile
  const t=marbleTexWall.clone(); t.needsUpdate=true; t.repeat.set(uw/48,uh/48);
  const mm=new THREE.MeshStandardMaterial({map:t, roughness:0.6}); mm.name='tile'; return mm;
}

// ---------- helpers ----------
const CEIL=96;
let TARGET=scene; const closedGroup=new THREE.Group(), openGroup=new THREE.Group(), styledGroup=new THREE.Group(); scene.add(closedGroup,openGroup,styledGroup);
function box(x1,x2,y1,y2,z1,z2,mat,shadow=true){
  const g=new THREE.BoxGeometry(x2-x1,y2-y1,z2-z1); const m=new THREE.Mesh(g,mat);
  m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2); m.castShadow=shadow; m.receiveShadow=true; TARGET.add(m); return m;}
function plane(w,h,mat,pos,rotY=0,rotX=0){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  m.position.set(...pos); m.rotation.set(rotX,rotY,0); m.receiveShadow=true; scene.add(m); return m;}
const T=4; // wall thickness
// wall along x (constant z), side: +1 if room is on +z side
function wallX(z,x1,x2,side,openings=[]){
  const zz = side>0 ? [z-T,z] : [z,z+T];
  let cur=x1; const segs=[...openings].sort((a,b)=>a[0]-b[0]);
  for(const [a,b,top] of segs){ if(a>cur) box(cur,a,0,CEIL,...zz,M.paint); box(a,b,top,CEIL,...zz,M.paint); cur=b; }
  if(cur<x2) box(cur,x2,0,CEIL,...zz,M.paint);
}
function wallZ(x,z1,z2,side,openings=[]){
  const xx = side>0 ? [x-T,x] : [x,x+T];
  let cur=z1; const segs=[...openings].sort((a,b)=>a[0]-b[0]);
  for(const [a,b,top] of segs){ if(a>cur) box(...xx,0,CEIL,cur,a,M.paint); box(...xx,top,CEIL,a,b,M.paint); cur=b; }
  if(cur<z2) box(...xx,0,CEIL,cur,z2,M.paint);
}

// ---------- shell (inches; from Polycam scan) ----------
// main room x -66..24 (plus x 24..64 shower alcove for z -11..49), z -49..49
const floor = new THREE.Mesh(new THREE.PlaneGeometry(130,98), M.floor);
floor.rotation.x=-Math.PI/2; floor.position.set(-1,0,0); floor.receiveShadow=true;
floorTex.repeat.set(130/36, 98/72); scene.add(floor);
// ceiling
const ceil = plane(140,110,M.ceiling,[-1,CEIL,0],0,Math.PI/2);
// walls
wallZ(-66,-53,53,+1);                          // left (vanity) wall, room on +x
wallX(49,-70,68,-1,[[-38,-8,80]]);             // top wall with door to bedroom
wallX(-49,-70,44,+1,[[-28,0,80]]);             // bottom wall with door (to WC)
wallZ(64,-15,53,-1);                           // back of shower alcove
box(9,64,0,CEIL,-17,-11,M.paint);              // wall between closet and shower
wallZ(40,-53,-11,-1);                          // closet right wall
// closet front wall at x=9 with 24" door opening
box(5,9,0,CEIL,-49,-47,M.paint); box(5,9,0,CEIL,-19,-11,M.paint); box(5,9,80,CEIL,-47,-19,M.paint);
// door casings + doors
function casingZ(z,x1,x2,side){ const zz=side>0?[z,z+0.8]:[z-0.8,z]; box(x1-3,x1,0,79.98,...zz,M.trim,false); box(x2,x2+3,0,79.98,...zz,M.trim,false); box(x1-3,x2+3,80,83.5,...zz,M.trim,false);}
casingZ(49,-38,-8,-1); casingZ(-49,-28,0,+1);


// ---------- baseboards (5" tall), stopping at door casings ----------
const bbX=(z,x1,x2,dz)=>box(x1,x2,0,5,Math.min(z,z+dz),Math.max(z,z+dz),M.trim,false);   // along x on wall z, dz into room
const bbZ=(x,z1,z2,dx)=>box(Math.min(x,x+dx),Math.max(x,x+dx),0,5,z1,z2,M.trim,false);
bbZ(-66,-49,49,0.6);                       // vanity wall
bbX(49,-66,-41,-0.6); bbX(49,-5,16,-0.6);  // top wall (door -38..-8)
bbX(-49,-66,-31,0.6); bbX(-49,3,5,0.6);    // bottom wall (door -28..0)
bbZ(5,-16,-11,-0.6);                       // closet front stub
bbX(-11,5,16,0.6);                         // closet/shower wall face

// ---------- 6-panel doors ----------
const panelMat=new THREE.MeshStandardMaterial({color:'#f6f5f1',roughness:0.5}); panelMat.name='door';
const shadowMat=new THREE.MeshStandardMaterial({color:'#f0eee9',roughness:0.5}); shadowMat.name='door';
function sixPanels(a1,a2,place){ // place(u1,u2,y1,y2) draws a raised panel in door coords
  const W=Math.abs(a2-a1), st=Math.min(4.5,W*0.15), cg=Math.min(2,W*0.06), mid=(a1+a2)/2, rows=[[5,26],[31,60],[65,76]];
  const one=(u1,u2,y1,y2)=>{ const L=0.7;
    if(!EXPORT){ place(u1,u2,y1,y1+L,shadowMat); place(u1,u2,y2-L,y2,shadowMat); place(u1,u1+L,y1,y2,shadowMat); place(u2-L,u2,y1,y2,shadowMat); }
    if(EXPORT) place(u1,u2,y1,y2,panelMat); else place(u1+1.2,u2-1.2,y1+1.2,y2-1.2,panelMat); };
  for(const [y1,y2] of rows){ if(W<20) one(a1+st,a2-st,y1,y2); else { one(a1+st,mid-cg,y1,y2); one(mid+cg,a2-st,y1,y2); } }
}
// leaf in a wall running along x (face toward +dz)
function doorX(z,x1,x2,dir,knobX){ const zz=dir>0?[z,z+1.4]:[z-1.4,z]; box(x1,x2,0,80,...zz,M.door);
  const f=dir>0?z+1.4:z-1.4; sixPanels(x1,x2,(u1,u2,y1,y2,m)=>box(u1,u2,y1,y2,Math.min(f,f+dir*(m===panelMat?0.35:0.12)),Math.max(f,f+dir*(m===panelMat?0.35:0.12)),m,false));
  const k=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),M.metal); k.position.set(knobX,36,f+dir*1.2); scene.add(k); }
function doorZ(x,z1,z2,dir,knobZ){ const xx=dir>0?[x,x+1.4]:[x-1.4,x]; box(...xx,0,80,z1,z2,M.door);
  const f=dir>0?x+1.4:x-1.4; sixPanels(z1,z2,(u1,u2,y1,y2,m)=>box(Math.min(f,f+dir*(m===panelMat?0.35:0.12)),Math.max(f,f+dir*(m===panelMat?0.35:0.12)),y1,y2,u1,u2,m,false));
  const k=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),M.metal); k.position.set(f+dir*1.2,36,knobZ); TARGET.add(k); }
doorX(49.5,-38,-8,-1,-35);     // to bedroom, face toward room (-z)
doorX(-49.5,-28,0,+1,-3);      // to WC, face toward room (+z)
// closet double doors in x=5..9 wall, faces toward room (-x)

TARGET=closedGroup; doorZ(6.6,-46.9,-33.1,-1,-34.6); doorZ(6.6,-32.9,-19.1,-1,-31.4); TARGET=scene;
{
  // leaves swung open ~95deg into the room, hinged at each jamb
  function openLeaf(hingeZ, sign){ const g=new THREE.Group(); g.position.set(5.9,0,hingeZ); openGroup.add(g); const W=13.8;
    const add=(x1,x2,y1,y2,z1,z2,m)=>{const mm=new THREE.Mesh(new THREE.BoxGeometry(x2-x1,y2-y1,Math.abs(z2-z1)),m); mm.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2); mm.castShadow=true; mm.receiveShadow=true; g.add(mm);};
    add(-0.7,0.7,0,80,0,sign*W,M.door);
    sixPanels(0,W,(u1,u2,y1,y2,m)=>{const d=(m===panelMat?0.35:0.12); add(-0.7-d,-0.7,y1,y2,sign*u1,sign*u2,m); add(0.7,0.7+d,y1,y2,sign*u1,sign*u2,m);});
    const k=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),M.metal); k.position.set(-1.9,36,sign*(W-1.5)); g.add(k);
    g.rotation.y = sign>0 ? -Math.PI*0.53 : Math.PI*0.53; }
  openLeaf(-47,+1); openLeaf(-19,-1);
}
// closet interior: shelf + double-hang rods along the back wall, clothes
{ const shelf=new THREE.MeshStandardMaterial({color:'#f4f3ef',roughness:0.6});
  box(26,40,82,83,-49,-17,shelf); box(26,40,44,45,-49,-17,shelf);
  for(const y of [79,41]){ const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,32,12),M.metal); rod.rotation.x=Math.PI/2; rod.position.set(29,y,-33); scene.add(rod); }
  const cols=['#2f3e4f','#d9d2c3','#7a8a99','#f1efe9','#3b3b3d','#9c8f7d','#c7cfd6','#5d6b57','#e6dccb','#1f2a36','#b6a79a','#8d97a3'];
  const hang=(y,len,n)=>{ let z=-47; for(let i=0;i<n && z<-19;i++){ const t=1.2+rnd()*1.3, c=cols[(rnd()*cols.length)|0];
      const L=len*(0.6+rnd()*0.45);
      const geo=new THREE.BoxGeometry(19,L,t,1,6,1); const pos=geo.attributes.position;
      for(let v=0;v<pos.count;v++){ const yy=pos.getY(v)/L+0.5; // 0 bottom..1 top
        const sh=1-0.12*yy; pos.setX(v,pos.getX(v)*sh*(yy>0.92?0.82:1)); pos.setZ(v,pos.getZ(v)*(1.25-0.5*yy)); }
      geo.computeVertexNormals();
      const gm=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:c,roughness:0.95})); gm.position.set(29,y-1.5-L/2,z+t/2);

document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
const doorsBtn=document.getElementById('doors'); doorsBtn.addEventListener('click',()=>{ const o=!openGroup.visible; openGroup.visible=o; closedGroup.visible=!o; doorsBtn.textContent=o?'Close closet':'Open closet'; doorsBtn.classList.toggle('on',o); doorsBtn.setAttribute('aria-pressed',o); });
const styleBtn=document.getElementById('style'); styleBtn.addEventListener('click',()=>{ const o=!styledGroup.visible; styledGroup.visible=o; styleBtn.textContent=o?'Styling on':'Styling off'; styleBtn.classList.toggle('on',o); styleBtn.setAttribute('aria-pressed',o); });
let drag=null; const el=renderer.domElement; const ray=new THREE.Raycaster();
el.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,moved:0}; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.moved+=Math.abs(dx)+Math.abs(dy);
  yaw+=dx*0.005; pitch=Math.max(-1.2,Math.min(1.2,pitch+dy*0.005)); drag.x=e.clientX; drag.y=e.clientY; });
el.addEventListener('pointerup',e=>{ if(drag && drag.moved<6){ const r=el.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
    const hit=ray.intersectObject(floor)[0]; if(hit){ const p=clampPos(new THREE.Vector3(hit.point.x,EYE,hit.point.z)); target={pos:p}; } } drag=null; });
const keys={}; addEventListener('keydown',e=>{keys[e.key]=true;}); addEventListener('keyup',e=>{keys[e.key]=false;});
let hold=0; const hb=(id,v)=>{ const b=document.getElementById(id); b.addEventListener('pointerdown',()=>hold=v); ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>hold=0)); };
hb('fw',1); hb('bk',-1);
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); fitFov(); });
let last=performance.now();
function frame(t){ const dt=Math.min(0.05,(t-last)/1000); last=t;
  let mv=hold; if(keys['ArrowUp']||keys['w']) mv=1; if(keys['ArrowDown']||keys['s']) mv=-1;
  if(keys['ArrowLeft']||keys['a']) yaw+=1.6*dt; if(keys['ArrowRight']||keys['d']) yaw-=1.6*dt;
  if(mv){ target=null; pos.x-=Math.sin(yaw)*mv*40*dt; pos.z-=Math.cos(yaw)*mv*40*dt; clampPos(pos); }
  if(target){ pos.lerp(target.pos,Math.min(1,dt*4)); if(target.view){ const d=new THREE.Vector3(...target.view).sub(pos); const ty=Math.atan2(-d.x,-d.z), tp=Math.atan2(d.y,Math.hypot(d.x,d.z));
      let dy=((ty-yaw+Math.PI*3)%(Math.PI*2))-Math.PI; yaw+=dy*Math.min(1,dt*4); pitch+=(tp-pitch)*Math.min(1,dt*4); }
    if(pos.distanceTo(target.pos)<0.3) target=null; }
  cam.position.copy(pos); cam.rotation.set(pitch,yaw,0,'YXZ'); renderer.render(scene,cam); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__ready=true;
</script></body></html>
